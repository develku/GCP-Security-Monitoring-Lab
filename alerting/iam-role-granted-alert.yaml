# Cloud Monitoring log-based alert policy — fires when a primitive IAM role
# (owner/editor) is granted at the project level. Maps to MITRE T1098.003.
# The condition filter is the SAME logic as detections/logging-filters/iam-role-granted.md.
#
# Apply with scripts/setup/create-alert.sh (it substitutes CHANNEL_ID), or paste
# the filter into Log Explorer and click "Create alert" (see docs/04-alerting.md).
displayName: "IAM primitive role granted (T1098.003)"
combiner: OR
conditions:
  - displayName: "owner/editor role added via SetIamPolicy"
    conditionMatchedLog:
      filter: |-
        logName:"cloudaudit.googleapis.com%2Factivity"
        protoPayload.methodName="SetIamPolicy"
        protoPayload.serviceData.policyDelta.bindingDeltas.action="ADD"
        (protoPayload.serviceData.policyDelta.bindingDeltas.role="roles/owner" OR
         protoPayload.serviceData.policyDelta.bindingDeltas.role="roles/editor")
alertStrategy:
  notificationRateLimit:
    period: 300s
notificationChannels:
  - CHANNEL_ID
documentation:
  content: |-
    A primitive role (owner/editor) was granted at the project level (T1098.003).
    Investigate: WHO (protoPayload.authenticationInfo.principalEmail),
    TO WHOM (bindingDeltas.member), FROM WHERE (requestMetadata.callerIp).
    Runbook: detections/logging-filters/iam-role-granted.md
  mimeType: text/markdown
